name: omp-hindsight

services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.9.2
    container_name: omp-hindsight
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9999:9999"
    environment:
      HOME: /home/hindsight
      USER: hindsight
      LOGNAME: hindsight
      HINDSIGHT_API_LLM_PROVIDER: openai-responses
      HINDSIGHT_API_LLM_BASE_URL: https://cpa.studio26f.org/v1
      HINDSIGHT_API_LLM_API_KEY: ${STUDIO26F_API_KEY:?STUDIO26F_API_KEY is required}
      HINDSIGHT_API_LLM_MODEL: gpt-5.4-mini
      HINDSIGHT_API_FAIL_ON_EXTRACTION_ERRORS: "true"
      HINDSIGHT_API_STORE_DOCUMENT_TEXT: "true"
      HINDSIGHT_API_LLM_TRACE_ENABLED: "false"
      HINDSIGHT_API_LOG_LEVEL: warning
      HINDSIGHT_API_WORKER_ID: omp-hindsight
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hindsight-data:
    name: omp-hindsight-data
