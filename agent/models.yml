        reasoning: true
        input: [text]
        contextWindow: 200000
        maxTokens: 16384
      - id: gpt-5.5
        name: GPT 5.5 (Hajimi)
        reasoning: true
        input: [text]
        contextWindow: 200000
        maxTokens: 16384
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro (Hajimi)
        reasoning: true
        input: [text]
        contextWindow: 128000
        maxTokens: 16384
