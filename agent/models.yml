# OMP Model & Provider Configuration
providers:
  anthropic:
    baseUrl: https://cpa.a-minos.org
    api: anthropic-messages
    auth: apiKey
    apiKey: AMINOS_API_KEY
    authHeader: true
  antigravity:
    # Keep CLIProxyAPI model IDs separate from native google-antigravity OAuth routes.
    baseUrl: https://cpa.a-minos.org/v1beta
    api: google-generative-ai
    auth: apiKey
    apiKey: AMINOS_API_KEY
    authHeader: true
    models:
      - id: claude-sonnet-5-5-high
      - id: claude-opus-5-5-high
      - id: gemini-4-argon-high
      - id: gemini-3.8-flash-high
      - id: gemini-3.5-flash-lite
      - id: gemini-3.1-flash-lite
      - id: gemini-3-flash
      - id: gpt-oss-120b-medium
      - id: gemini-3.1-flash-image
        kind: image
  openai-codex:
    baseUrl: https://cpa.studio26f.org:8443/backend-api
    auth: apiKey
    apiKey: STUDIO26F_API_KEY
  cpa-studio26f:
    baseUrl: https://cpa.studio26f.org:8443/v1
    auth: apiKey
    apiKey: STUDIO26F_API_KEY
    api: openai-responses
    models:
      - id: intern-s2
        name: 书生-S2
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high]
          requiresEffort: true
        supportsTools: true
        input: [text, image]
        contextWindow: 256000
        maxTokens: 128000
      - id: Atria-Dawn-Preview
        name: Atria Dawn Preview
        # The official model card also reports 256K context and text-only input.
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high]
          requiresEffort: true
        supportsTools: true
        input: [text]
        contextWindow: 256000
        maxTokens: 128000
      - id: Agents-A1
        name: Agents A1
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high]
          requiresEffort: true
        supportsTools: true
        input: [text, image]
        contextWindow: 256000
        maxTokens: 128000
      - id: deepseek-v4-flash-vision
        name: DeepSeek V4 Flash Vision
        # Gateway ID; DeepSeek now recommends deepseek-flash instead of deepseek-v4-flash-vision-exp.
        # Official reference limits and capabilities; gateway routing and limits are unverified.
        # https://api-docs.deepseek.com/quick_start/agent_integrations/codex
        # https://api-docs.deepseek.com/api/create-chat-completion
        # https://api-docs.deepseek.com/guides/thinking_mode
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, high, max]
          defaultLevel: high
          requiresEffort: false
        supportsTools: true
        input: [text, image]
        contextWindow: 1048576
        maxTokens: 393216
        compat:
          statefulResponses: false
          supportsReasoningSummary: false
          supportsImageDetailOriginal: true
      - id: glm-5.3
        name: GLM-5.3
        # Official reference limits and capabilities; gateway behavior is unverified.
        # https://docs.bigmodel.cn/cn/guide/models/text/glm-5.3
        # https://docs.bigmodel.cn/cn/coding-plan/latest-model
        # https://docs.bigmodel.cn/cn/guide/start/concept-param
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, high, max]
          defaultLevel: max
          requiresEffort: true
        supportsTools: true
        input: [text]
        contextWindow: 1000000
        maxTokens: 131072